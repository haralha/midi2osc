name: Build Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: midi2osc-macos-arm64
            is_mac: true
            target_arch: arm64
            macos_deployment_target: "11.0"
          - os: macos-15-intel
            artifact_name: midi2osc-macos-x86_64
            is_mac: true
            target_arch: x86_64
            macos_deployment_target: "10.15"
          - os: ubuntu-latest
            artifact_name: midi2osc-linux
            is_mac: false
            target_arch: x86_64
          - os: windows-latest
            artifact_name: midi2osc-windows
            is_mac: false
            target_arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.target_arch == 'arm64' && 'arm64' || 'x64' }}

      - name: Install Poetry
        run: pipx install poetry


      - name: Configure Poetry to use Python 3.11
        run: poetry env use 3.11

      - name: Install project dependencies
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: poetry install

      # Build for macOS ARM64 (Apple Silicon)
      - name: Build executable (macOS ARM64)
        if: matrix.is_mac == true && matrix.target_arch == 'arm64'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: poetry run poe build-mac

      # Build for macOS Intel x86_64
      - name: Build executable (macOS Intel x86_64)
        if: matrix.is_mac == true && matrix.target_arch == 'x86_64'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: poetry run poe build-mac

      # Build for Windows / Linux
      - name: Build executable (Windows / Linux)
        if: matrix.is_mac == false
        run: poetry run poe build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bin/

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*