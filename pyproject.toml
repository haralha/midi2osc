[project]
name = "midi2osc"
version = "0.1.0"
description = "Converts incoming MIDI events to OSC commands"
authors = [
    {name = "Harald Haugerud", email = "harald.haugerud@oda.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mido (>=1.3.3,<2.0.0)",
    "python-rtmidi (>=1.5.8,<2.0.0)",
    "python-osc (>=1.10.2,<2.0.0)",
    "pyside6 (>=6.11.1,<7.0.0)",
    "colorama (>=0.4.6,<0.5.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.22.0"
poethepoet = "^0.48.0"
mypy = "^2.3.0"

[tool.poe.tasks]
# Local execution tasks
cli = "python cli.py"
gui = "python gui.py"

# Cleanup tasks
clean = "rm -rf build bin *.spec"
clean-temp = "rm -rf build *.spec"

# Build task for CLI executable (single-file across all OS)
build-cli = "pyinstaller --onefile --distpath bin --name midi2osc --hidden-import mido.backends.rtmidi cli.py"

# Build task for macOS GUI (uses --onedir to bundle .app properly and avoid duplicate Dock icons)
build-gui-mac = "pyinstaller --onedir --windowed --distpath bin --name midi2osc-gui --hidden-import mido.backends.rtmidi gui.py"

# Build task for Windows and Linux GUI (uses --onefile to output a single executable)
build-gui-single = "pyinstaller --onefile --windowed --distpath bin --name midi2osc-gui --hidden-import mido.backends.rtmidi gui.py"

# Compound build task for macOS
build-mac = ["clean", "build-cli", "build-gui-mac", "clean-temp"]

# Default compound build task for Windows and Linux
build = ["clean", "build-cli", "build-gui-single", "clean-temp"]